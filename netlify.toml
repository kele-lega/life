[build]
  command = "npx next build --webpack"
  publish = ".next"

# Next 16 Turbopack emits hashed pg/@aws-sdk aliases that Netlify cannot resolve.

[build.environment]
  NODE_VERSION = "24"

# Netlify auto-detects Next.js and installs its maintained OpenNext adapter.
# Keep the server runtime for /api/location/reverse and dynamic Diary routes.
