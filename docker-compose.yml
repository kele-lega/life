services:
  postgres:
    image: postgres:16-alpine
    container_name: life-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: life_cloud
    volumes:
      - life_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d life_cloud"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  migrate:
    image: postgres:16-alpine
    container_name: life-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: life_cloud
      CLOUD_APP_PASSWORD: ${CLOUD_APP_PASSWORD}
      CLOUD_WORKER_PASSWORD: ${CLOUD_WORKER_PASSWORD}
    volumes:
      - ./infrastructure/cloud:/sql:ro
    entrypoint: ["/bin/sh", "/sql/local-init.sh"]
    restart: "no"

  app:
    build: .
    image: life:local
    container_name: life
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    volumes:
      - life_objects:/data/objects
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 25s

volumes:
  life_postgres:
  life_objects:
